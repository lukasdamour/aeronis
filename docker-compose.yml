services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aeronis:latest
    ports:
      - "8000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - tiles

  tiles:
    build:
      context: ./tiles-pipeline
      dockerfile: Dockerfile
    image: aeronis-tiles:latest
    ports:
      - "8765:8765"
    volumes:
      # Drop your generated .mbtiles file(s) here (see build_offline_map.sh).
      # Not baked into the image since these files can be several GB.
      - ./tiles-pipeline/data:/app/data:ro
    environment:
      - TILES_HOST=0.0.0.0
      - TILES_FILE=/app/data/spain.mbtiles
      - TILES_PORT=8765
    restart: unless-stopped